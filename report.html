<script>

let isLoaded = false
  
const API="https://script.google.com/macros/s/AKfycbyV4PNjlFskTfF0Ol6xrZdWpSCJm54bi33l0M66QpluNo8X6B7Js8LZRtuY7T05KsShoQ/exec"

const params = new URLSearchParams(location.search)
const date = params.get("date") || new Date().toISOString().split("T")[0]
  
async function downloadPDF(){

if(!isLoaded){
alert("⏳ โปรดรอสักครู่...")
return
}

const loadingEl = document.getElementById("loading")

try{

loadingEl.style.display = "flex"
loadingEl.innerHTML = "⏳ กำลังสร้าง PDF...<br><small>โปรดรอสักครู่</small>"

const element = document.getElementById("report")

await document.fonts.ready
await new Promise(r => setTimeout(r, 300))

const canvas = await html2canvas(element,{
scale:2,
useCORS:true,
backgroundColor:"#ffffff",
letterRendering:true
})

const { jsPDF } = window.jspdf
const pdf = new jsPDF("p","mm","a4")

const margin = 10
const pageWidth = 210
const pageHeight = 297

const usableWidth = pageWidth - (margin * 2)
const usableHeight = pageHeight - (margin * 2)

const imgWidth = usableWidth
const imgHeight = canvas.height * imgWidth / canvas.width

const pageHeightPx = Math.floor(
(canvas.width * usableHeight) / usableWidth
)

let renderedHeight = 0

while(renderedHeight < canvas.height){

const pageCanvas = document.createElement("canvas")
const pageCtx = pageCanvas.getContext("2d")

pageCanvas.width = canvas.width
pageCanvas.height = Math.min(
pageHeightPx,
canvas.height - renderedHeight
)

pageCtx.fillStyle = "#ffffff"
pageCtx.fillRect(
0,
0,
pageCanvas.width,
pageCanvas.height
)

pageCtx.drawImage(
canvas,
0,
renderedHeight,
canvas.width,
pageCanvas.height,
0,
0,
canvas.width,
pageCanvas.height
)

const imgData = pageCanvas.toDataURL("image/png")

if(renderedHeight > 0){
pdf.addPage()
}

const currentPageHeight =
(pageCanvas.height * imgWidth) / pageCanvas.width

pdf.addImage(
imgData,
"PNG",
margin,
margin,
imgWidth,
currentPageHeight
)

renderedHeight += pageCanvas.height
}

const fileDate = formatFileDate(date)
pdf.save(`burapa-student-${fileDate}.pdf`)

}catch(e){

console.error(e)
alert("❌ สร้าง PDF ไม่สำเร็จ")

}finally{

loadingEl.style.display = "none"

}

}
if(!date){
  
document.getElementById("dateText").innerText = "-"
  
}else{
  
document.getElementById("dateText").innerHTML = formatThaiDate(date)
  
}

function formatFileDate(dateStr){
const d = new Date(dateStr)

const day = d.getDate().toString().padStart(2,"0")
const month = (d.getMonth()+1).toString().padStart(2,"0")
const year = d.getFullYear() + 543

return `${day}-${month}-${year}`
  
}
  
function formatThaiDate(dateStr){
  
const d = new Date(dateStr)

const day = d.toLocaleDateString('th-TH',{ weekday:'long' }).replace("วัน","")
  
const dNum = d.getDate()
  
const month = d.toLocaleDateString('th-TH',{ month:'long' })
  
const year = d.getFullYear() + 543

return `
วัน&nbsp;&nbsp;&nbsp;&nbsp;${day}
&nbsp;&nbsp;&nbsp;&nbsp;ที่&nbsp;&nbsp;&nbsp;&nbsp;${dNum}
&nbsp;&nbsp;&nbsp;&nbsp;เดือน&nbsp;&nbsp;&nbsp;&nbsp;${month}
&nbsp;&nbsp;&nbsp;&nbsp;พ.ศ.&nbsp;&nbsp;&nbsp;&nbsp;${year}
`
}

document.getElementById("loading").innerText = "⏳ กำลังโหลดข้อมูล..."
  
async function fetchWithFallback(dateStr){

let d = new Date(dateStr)

for(let i=0;i<30;i++){
    
const tryDate = d.toISOString().split("T")[0]

try{
  
const res = await fetch(API + "?mode=report&date=" + tryDate)
const data = await res.json()

if(data && data.length > 0){

return { data, fallbackDate: tryDate }

}

}catch(e){}

d.setDate(d.getDate()-1)
  
}

return { data:[], fallbackDate:null }
  
}
  
async function loadReport(){

let data = []
let isFallback = false

try{
const res = await fetch(API + "?mode=report&date=" + date)
data = await res.json()

const hasTodayData = data && data.length > 0
const isFallback = !hasTodayData

if (!hasTodayData) {
const result = await fetchWithFallback(date)
data = result.data
}

if(data.length === 0){
  
document.getElementById("dataBody").innerHTML = `

<tr><td colspan="16">⚠ ไม่พบข้อมูล</td></tr>
`
  
document.getElementById("loading").style.display = "none"
  
return
  
}

}catch(e){
  
alert("❌ โหลดข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง")
  
document.getElementById("loading").style.display = "none"
  
return
  
}

let html=""
  
document.getElementById("loading").innerText = "⏳ กำลังสร้างรายงาน..."
document.getElementById("dataBody").innerHTML = `<tr><td colspan="16">⏳ กำลังสร้าง Report...</td></tr>`;

let levels = {}

let totalAll = 0
let totalMale = 0
let totalFemale = 0

let totalPresent = 0
let totalPresentMale = 0
let totalPresentFemale = 0

let totalSick = 0
let totalLeave = 0
let totalAbsent = 0

let totalInMale = 0
let totalInFemale = 0
let totalInAll = 0

let totalOutMale = 0
let totalOutFemale = 0
let totalOutAll = 0
  
data.forEach(r=>{

const level = getLevel(r.room)

if(!levels[level]){
levels[level] = {
rows:[],
total:0,
male:0,
female:0,
present:0,
presentMale:0,
presentFemale:0,
sick:0,
leave:0,
absent:0,

in_m:0,
in_f:0,
in_total:0,

out_m:0,
out_f:0,
out_total:0
}
}

const total = Number(r.total)||0
const male = Number(r.male)||0
const female = Number(r.female)||0

const present = isFallback ? 0 : Number(r.present)||0
const presentMale = isFallback ? 0 : Number(r.present_m)||0
const presentFemale = isFallback ? 0 : Number(r.present_f)||0

const sick = isFallback ? 0 : Number(r.sick || 0)
const leave = isFallback ? 0 : Number(r.leave || 0)
const absent = isFallback ? 0 : Number(r.absent || 0)
  
levels[level].rows.push({
room:r.room,
total,male,female,
present,presentMale,presentFemale,
sick,leave,absent,

in_m: isFallback ? "" : (r.in_m === "" || r.in_m == null ? "" : Number(r.in_m)),
in_f: isFallback ? "" : (r.in_f === "" || r.in_f == null ? "" : Number(r.in_f)),
in_total: isFallback ? 0 : (
  (Number(r.in_m) || 0) + (Number(r.in_f) || 0)
),

out_m: isFallback ? 0 : Number(r.out_m || 0),
out_f: isFallback ? 0 : Number(r.out_f || 0),
out_total: isFallback ? 0 : (
Number(r.out_m || 0) + Number(r.out_f || 0)
)
});

levels[level].total += total
levels[level].male += male
levels[level].female += female

levels[level].present += present
levels[level].presentMale += presentMale
levels[level].presentFemale += presentFemale
levels[level].sick += Number(sick)||0
levels[level].leave += Number(leave)||0
levels[level].absent += Number(absent)||0
  
totalAll += total
totalMale += male
totalFemale += female

totalPresent += present
totalPresentMale += presentMale
totalPresentFemale += presentFemale

totalSick += Number(sick)||0
totalLeave += Number(leave)||0
totalAbsent += Number(absent)||0

const inM = isFallback ? 0 : (Number(r.in_m) || 0)
const inF = isFallback ? 0 : (Number(r.in_f) || 0)
const inTotal = inM + inF

const outM = isFallback ? 0 : (Number(r.out_m) || 0)
const outF = isFallback ? 0 : (Number(r.out_f) || 0)
const outTotal = outM + outF

levels[level].in_m += inM
levels[level].in_f += inF
levels[level].in_total += inTotal

levels[level].out_m += outM
levels[level].out_f += outF
levels[level].out_total += outTotal

totalInMale += inM
totalInFemale += inF
totalInAll += inTotal

totalOutMale += outM
totalOutFemale += outF
totalOutAll += outTotal
})

let groupSum = {
  "ป.": {
    male:0,female:0,total:0,
    presentMale:0,presentFemale:0,present:0,
    sick:0, leave:0, absent:0,

    in_m:0, in_f:0, in_total:0,
    out_m:0, out_f:0, out_total:0
  },

  "ม.": {
    male:0,female:0,total:0,
    presentMale:0,presentFemale:0,present:0,
    sick:0, leave:0, absent:0,

    in_m:0, in_f:0, in_total:0,
    out_m:0, out_f:0, out_total:0
  },

  "ปวช": {
    male:0,female:0,total:0,
    presentMale:0,presentFemale:0,present:0,
    sick:0, leave:0, absent:0,

    in_m:0, in_f:0, in_total:0,
    out_m:0, out_f:0, out_total:0
  }
}

const order = ["ป.1","ป.2","ป.3","ป.4","ป.5","ป.6","ม.1","ม.2","ม.3","ม.4","ม.5","ม.6","ปวช.1","ปวช.2","ปวช.3"]

order.forEach(level=>{

let groupKey = ""

if(level.startsWith("ป.")) groupKey = "ป."
else if(level.startsWith("ม.")) groupKey = "ม."
else if(level.startsWith("ปวช.")) groupKey = "ปวช"

if(groupKey && levels[level]){
groupSum[groupKey].male += levels[level].male
groupSum[groupKey].female += levels[level].female
groupSum[groupKey].total += levels[level].total

groupSum[groupKey].presentMale += levels[level].presentMale
groupSum[groupKey].presentFemale += levels[level].presentFemale
groupSum[groupKey].present += levels[level].present

groupSum[groupKey].sick += levels[level].sick
groupSum[groupKey].leave += levels[level].leave
groupSum[groupKey].absent += levels[level].absent

groupSum[groupKey].in_m += levels[level].in_m
groupSum[groupKey].in_f += levels[level].in_f
groupSum[groupKey].in_total += levels[level].in_total

groupSum[groupKey].out_m += levels[level].out_m
groupSum[groupKey].out_f += levels[level].out_f
groupSum[groupKey].out_total += levels[level].out_total
  
}
  
if(!levels[level]) return
  
levels[level].rows.sort((a,b)=>{

const numA = (a.room.match(/\d+/g) || ["0"])
const numB = (b.room.match(/\d+/g) || ["0"])

if(Number(numA[0]) !== Number(numB[0])){
  return Number(numA[0]) - Number(numB[0])
}

return (Number(numA[1]||0)) - (Number(numB[1]||0))

})

levels[level].rows.forEach(r=>{
  
html += `
<tr>
<td>${r.room}</td>

<td>${r.male}</td>
<td>${r.female}</td>
<td>${r.total}</td>

<td>${r.presentMale}</td>
<td>${r.presentFemale}</td>
<td>${r.present}</td>

<td>${r.sick}</td>
<td>${r.leave}</td>
<td>${r.absent}</td>

<td>${r.in_m ?? ""}</td>
<td>${r.in_f ?? ""}</td>
<td>${r.in_total ?? ""}</td>

<td>${r.out_m ?? ""}</td>
<td>${r.out_f ?? ""}</td>
<td>${r.out_total ?? ""}</td>
</tr>
`
  
})

let colorClass = ""

if(level.startsWith("ป.")){
  colorClass = "primary"
}else if(level.startsWith("ม.") || level.startsWith("ปวช")){
  colorClass = "secondary"
}
  
html += `
<tr class="sum-row ${colorClass}">
<td>รวม ${level}</td>

<td>${levels[level].male}</td>
<td>${levels[level].female}</td>
<td>${levels[level].total}</td>

<td>${levels[level].presentMale}</td>
<td>${levels[level].presentFemale}</td>
<td>${levels[level].present}</td>

<td>${levels[level].sick}</td>
<td>${levels[level].leave}</td>
<td>${levels[level].absent}</td>

<td>${levels[level].in_m}</td>
<td>${levels[level].in_f}</td>
<td>${levels[level].in_total}</td>

<td>${levels[level].out_m}</td>
<td>${levels[level].out_f}</td>
<td>${levels[level].out_total}</td>
</tr>
`
  
if(level === "ป.6"){
html += `
<tr class="sum-row primary section-break">
<td>รวมประถมทั้งหมด</td>
<td>${groupSum["ป."].male}</td>
<td>${groupSum["ป."].female}</td>
<td>${groupSum["ป."].total}</td>
<td>${groupSum["ป."].presentMale}</td>
<td>${groupSum["ป."].presentFemale}</td>
<td>${groupSum["ป."].present}</td>
<td>${groupSum["ป."].sick}</td>
<td>${groupSum["ป."].leave}</td>
<td>${groupSum["ป."].absent}</td>

<td>${groupSum["ป."].in_m}</td>
<td>${groupSum["ป."].in_f}</td>
<td>${groupSum["ป."].in_total}</td>

<td>${groupSum["ป."].out_m}</td>
<td>${groupSum["ป."].out_f}</td>
<td>${groupSum["ป."].out_total}</td>
</tr>
`
  
}

if(level === "ม.6"){
html += `
<tr class="sum-row secondary section-break">
<td>รวมมัธยมทั้งหมด</td>
<td>${groupSum["ม."].male}</td>
<td>${groupSum["ม."].female}</td>
<td>${groupSum["ม."].total}</td>
<td>${groupSum["ม."].presentMale}</td>
<td>${groupSum["ม."].presentFemale}</td>
<td>${groupSum["ม."].present}</td>
<td>${groupSum["ม."].sick}</td>
<td>${groupSum["ม."].leave}</td>
<td>${groupSum["ม."].absent}</td>

<td>${groupSum["ม."].in_m}</td>
<td>${groupSum["ม."].in_f}</td>
<td>${groupSum["ม."].in_total}</td>

<td>${groupSum["ม."].out_m}</td>
<td>${groupSum["ม."].out_f}</td>
<td>${groupSum["ม."].out_total}</td>
</tr>
`
  
}

if(level === "ปวช.3"){
html += `
<tr class="sum-row secondary section-break">
<td>รวม ปวช ทั้งหมด</td>
<td>${groupSum["ปวช"].male}</td>
<td>${groupSum["ปวช"].female}</td>
<td>${groupSum["ปวช"].total}</td>
<td>${groupSum["ปวช"].presentMale}</td>
<td>${groupSum["ปวช"].presentFemale}</td>
<td>${groupSum["ปวช"].present}</td>

function getLevel(room){

if(!room) return "อื่นๆ"

room = room.trim()

let match = room.match(/ป\.?\s*(\d+)/)
if(match) return "ป." + match[1]

if(room.includes("ประถม")){
match = room.match(/\d+/)
if(match) return "ป." + match[0]
}

match = room.match(/ม\.?\s*(\d+)/)
if(match) return "ม." + match[1]

if(room.includes("มัธยม")){
match = room.match(/\d+/)
if(match) return "ม." + match[0]
}

match = room.match(/ปวช\.?\s*(\d+)/)
if(match) return "ปวช." + match[1]

if(room.includes("ชั้นประกาศนียบัตรวิชาชีพ")){
match = room.match(/\d+/)
if(match) return "ปวช." + match[0]
}

return "อื่นๆ"
  
}
