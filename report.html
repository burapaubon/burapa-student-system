<script>

const API="https://script.google.com/macros/s/AKfycbyV4PNjlFskTfF0Ol6xrZdWpSCJm54bi33l0M66QpluNo8X6B7Js8LZRtuY7T05KsShoQ/exec"

const params = new URLSearchParams(location.search)
const date = params.get("date") || new Date().toISOString().split("T")[0]
  
function formatThaiDate(dateStr){
  const d = new Date(dateStr)

  const day = d.toLocaleDateString('th-TH',{ weekday:'long' }).replace("วัน","")
  const dNum = d.getDate()
  const month = d.toLocaleDateString('th-TH',{ month:'long' })
  const year = d.getFullYear() + 543

  return `
วัน&nbsp;&nbsp;&nbsp;&nbsp;${day}
&nbsp;&nbsp;&nbsp;&nbsp;ที่&nbsp;&nbsp;&nbsp;&nbsp;${dNum}
&nbsp;&nbsp;&nbsp;&nbsp;เดือน&nbsp;&nbsp;&nbsp;&nbsp;${month}
&nbsp;&nbsp;&nbsp;&nbsp;พ.ศ.&nbsp;&nbsp;&nbsp;&nbsp;${year}
`
}

function formatTitleDate(dateStr){
  const d = new Date(dateStr)
  const day = d.getDate()
  const month = d.toLocaleDateString('th-TH',{ month:'short' })
  const year = d.getFullYear() + 543
  return `${day} ${month} ${year}`
}

document.title = `รายงานสถิตินักเรียน (${formatTitleDate(date)})`
  
document.getElementById("loading").innerText = "⏳ กำลังโหลดข้อมูล..."

function show(v){
  return (v === 0 || v === "0") ? "" : v
}
  
async function fetchWithFallback(dateStr){

let d = new Date(dateStr)

for(let i=0;i<30;i++){
    
const tryDate = d.toISOString().split("T")[0]

try{
  
const res = await fetch(API + "?mode=report&date=" + tryDate)
const data = await res.json()

if(Array.isArray(data) && data.length > 0){

return { data, fallbackDate: tryDate }

}

}catch(e){}

d.setDate(d.getDate()-1)
  
}

return { data:[], fallbackDate:null }
  
}

async function getPreviousData(room, date){

let d = new Date(date)

for(let i=0;i<30;i++){

  d.setDate(d.getDate() - 1)
  const prevDate = d.toISOString().split("T")[0]

  try{

    const res = await fetch(API + `?mode=getbydate&room=${room}&date=${prevDate}`)
    const data = await res.json()

    if(data && (data.all_boys != null || data.all_girls != null)){
      return data
    }

  }catch(e){}

}

return {}
}

const roomCache = {}

async function getPreviousDataFast(cache, room, date){

if(cache[room]) return cache[room]

try{
  const res = await fetch(API + `?mode=getprevious&room=${room}&date=${date}`)
  const data = await res.json()

  cache[room] = data || {}
  return cache[room]

}catch(e){
  cache[room] = {}
  return {}
}
}
  
async function loadReport(){

document.getElementById("dateText").innerHTML = formatThaiDate(date)
  
let data = []
let isFallback = false

let useDate = date

try{
  const result = await fetchWithFallback(date)
  data = result.data
  isFallback = result.fallbackDate !== date

  useDate = result.fallbackDate || date

if(data.length === 0){
  
document.getElementById("dataBody").innerHTML = `

<tr><td colspan="16">⚠ ไม่พบข้อมูล</td></tr>
`

document.getElementById("dateText").innerHTML = formatThaiDate(date)

document.getElementById("loading").style.display = "none"
  
return
  
}

}catch(e){
  
alert("❌ โหลดข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง")
  
document.getElementById("loading").style.display = "none"
  
return
  
}

document.getElementById("dataBody").innerHTML = `<tr><td colspan="16">⏳ กำลังสร้าง Report...</td></tr>`;

let totalAll = 0
let totalMale = 0
let totalFemale = 0

let totalPresent = 0
let totalPresentMale = 0
let totalPresentFemale = 0

let totalSick = 0
let totalLeave = 0
let totalAbsent = 0

let totalInMale = 0
let totalInFemale = 0
let totalInTotal = 0

let totalOutMale = 0
let totalOutFemale = 0
let totalOutTotal = 0

for (const r of data) {

  const prevData = await getPreviousDataFast(roomCache, r.room, useDate)

  const prevMale = Number(prevData.all_boys) || 0
  const prevFemale = Number(prevData.all_girls) || 0

  let currMale = (r.male !== undefined && r.male !== "")
    ? Number(r.male)
    : prevMale

  let currFemale = (r.female !== undefined && r.female !== "")
    ? Number(r.female)
    : prevFemale

const hasPresentData = r.present_m !== undefined && r.present_f !== undefined

const total = currMale + currFemale
  
  let inMale = 0
  let inFemale = 0
  let outMale = 0
  let outFemale = 0
  let inTotal = 0
  let outTotal = 0

if (prevMale !== 0 || prevFemale !== 0) {

  if (currMale > prevMale) {
    inMale = currMale - prevMale
    inTotal += inMale
  } else if (currMale < prevMale) {
    outMale = prevMale - currMale
    outTotal += outMale
  }

  if (currFemale > prevFemale) {
    inFemale = currFemale - prevFemale
    inTotal += inFemale
  } else if (currFemale < prevFemale) {
    outFemale = prevFemale - currFemale
    outTotal += outFemale
  }

totalInMale += inMale
totalInFemale += inFemale
totalInTotal += inTotal

totalOutMale += outMale
totalOutFemale += outFemale
totalOutTotal += outTotal
    
}

  const level = getLevel(r.room)

  if(!levels[level]){
    levels[level] = {
      rows:[],
      total:0,
      male:0,
      female:0,
      present:0,
      presentMale:0,
      presentFemale:0,
      sick:0,
      leave:0,
      absent:0,
      inMale:0,
      inFemale:0, 
      inTotal:0,
      
      outMale:0, 
      outFemale:0, 
      outTotal:0,
    }
  }

const hasTodayInput = r.present_m !== undefined && r.present_f !== undefined

const presentMale = hasTodayInput ? Number(r.present_m) || 0 : ""
const presentFemale = hasTodayInput ? Number(r.present_f) || 0 : ""
const present = hasTodayInput ? (presentMale + presentFemale) : 0

  const sick = Number(r.sick) || 0
  const leave = Number(r.leave) || 0
  const absent = Number(r.absent) || 0

  totalSick += sick
  totalLeave += leave
  totalAbsent += absent
  
totalAll += total
totalMale += currMale
totalFemale += currFemale

  totalPresent += present
  totalPresentMale += presentMale
  totalPresentFemale += presentFemale
  
  levels[level].rows.push({
    room:r.room,
    total,
male: currMale,
female: currFemale,
    present,presentMale,presentFemale,
    hasTodayInput,
    sick,leave,absent,
    inMale, inFemale, inTotal,
    outMale, outFemale, outTotal
  })

levels[level].male += currMale
levels[level].female += currFemale
levels[level].total += total
  levels[level].present += present
  levels[level].presentMale += presentMale
  levels[level].presentFemale += presentFemale
  levels[level].sick += sick
  levels[level].leave += leave
  levels[level].absent += absent

  levels[level].inMale += inMale
  levels[level].inFemale += inFemale
  levels[level].inTotal += inTotal

  levels[level].outMale += outMale
  levels[level].outFemale += outFemale
  levels[level].outTotal += outTotal
}

let groupSum = {
  "ป.": {male:0,female:0,total:0,presentMale:0,presentFemale:0,present:0, sick:0, leave:0, absent:0,
  inMale:0,inFemale:0,inTotal:0,
  outMale:0,outFemale:0,outTotal:0},
  "ม.": {male:0,female:0,total:0,presentMale:0,presentFemale:0,present:0, sick:0, leave:0, absent:0,
  inMale:0,inFemale:0,inTotal:0,
  outMale:0,outFemale:0,outTotal:0},

  inMale:0,inFemale:0,inTotal:0,
  outMale:0,outFemale:0,outTotal:0}
}

const order = ["ป.1","ป.2","ป.3","ป.4","ป.5","ป.6","ม.1","ม.2","ม.3","ม.4","ม.5","ม.6","ปวช.1","ปวช.2","ปวช.3"]

order.forEach(lv => {

let groupKey = ""

if(lv.startsWith("ป.")) groupKey = "ป."
else if(lv.startsWith("ม.")) groupKey = "ม."
else if(lv.startsWith("ปวช")) groupKey = "ปวช"

if(groupKey && levels[lv]){
groupSum[groupKey].male += levels[lv].male
groupSum[groupKey].female += levels[lv].female
groupSum[groupKey].total += levels[lv].total

groupSum[groupKey].presentMale += levels[lv].presentMale
groupSum[groupKey].presentFemale += levels[lv].presentFemale
groupSum[groupKey].present += levels[lv].present

groupSum[groupKey].sick += levels[lv].sick
groupSum[groupKey].leave += levels[lv].leave
groupSum[groupKey].absent += levels[lv].absent

groupSum[groupKey].inMale += levels[lv].inMale
groupSum[groupKey].inFemale += levels[lv].inFemale
groupSum[groupKey].inTotal += levels[lv].inTotal

groupSum[groupKey].outMale += levels[lv].outMale
groupSum[groupKey].outFemale += levels[lv].outFemale
groupSum[groupKey].outTotal += levels[lv].outTotal
}
  
if(!levels[lv]) return
  
levels[lv].rows.sort((a,b)=>{

const numA = a.room.match(/\d+/g) || [0,0]
const numB = b.room.match(/\d+/g) || [0,0]

if(!numA || !numB) return 0

if(numA[0] != numB[0]){
  
return Number(numA[0]) - Number(numB[0])
  
}

return (Number(numA[1]||0)) - (Number(numB[1]||0))
  
})
  
levels[lv].rows.forEach(r=>{
  
html += `
<tr>
<td>${r.room}</td>

<td>${r.male}</td>
<td>${r.female}</td>
<td>${r.total}</td>

<td>${r.hasTodayInput ? r.presentMale : ""}</td>
<td>${r.hasTodayInput ? r.presentFemale : ""}</td>
<td>${r.present}</td>

<td>${show(r.sick)}</td>
<td>${show(r.leave)}</td>
<td>${show(r.absent)}</td>

<td>${show(r.inMale)}</td>
<td>${show(r.inFemale)}</td>
<td>${r.inTotal || 0}</td>

<td>${show(r.outMale)}</td>
<td>${show(r.outFemale)}</td>
<td>${r.outTotal || 0}</td>
</tr>
`
  
})

let colorClass = ""

if(lv.startsWith("ป.")){

}else if(lv.startsWith("ม.") || lv.startsWith("ปวช")){

<td>${levels[lv].outMale || 0}</td>
<td>${levels[lv].outFemale || 0}</td>
<td>${levels[lv].outTotal || 0}</td>

`

<td>${groupSum["ป."].outMale}</td>
<td>${groupSum["ป."].outFemale}</td>
<td>${groupSum["ป."].outTotal || 0}</td>
</tr>
`
  
}

if(lv === "ม.6"){

html += `

})

function getLevel(room){

if(!room) return "อื่นๆ"

room = room.trim()

let match = room.match(/ป\.?\s*(\d+)/)
if(match) return "ป." + match[1]

if(room.includes("ประถม")){
match = room.match(/\d+/)
if(match) return "ป." + match[0]
}

match = room.match(/ม\.?\s*(\d+)/)
if(match) return "ม." + match[1]

if(room.includes("มัธยม")){
match = room.match(/\d+/)
if(match) return "ม." + match[0]
}

match = room.match(/ปวช\.?\s*(\d+)/)
if(match) return "ปวช." + match[1]

if(room.includes("ชั้นประกาศนียบัตรวิชาชีพ")){
match = room.match(/\d+/)
if(match) return "ปวช." + match[0]
}

return "อื่นๆ"
  
}
